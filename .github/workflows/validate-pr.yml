name: Validate Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Curriculum & Telemetry Profiles
        run: |
          python tools/validate_curriculum.py --all

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/web_ui/package-lock.json

      - name: Build Vite Web UI & Run JS Unit Tests
        run: |
          npm --prefix tools/web_ui ci
          npm --prefix tools/web_ui run build
          node --test tests/unit/test_security_remediation.test.cjs tests/unit/test_web_ui_migration.test.cjs

      - name: Validate Web UI Static Assets & Structural Integrity
        run: |
          python tools/validate_web_ui.py

      - name: Run Kinematic Simulation & Adjudication Suite
        run: |
          python tools/simulate_all_tests.py

      - name: Run Python Unit Test Suite
        run: |
          python -m unittest discover tests
