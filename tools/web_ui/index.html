<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AC License Center — Assetto Corsa License Test Designer</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://munoznicolas.github.io/ac-license-center/" />
    <meta name="description" content="Assetto Corsa Driving School &amp; Telemetry Studio. Design license tests, inspect track gates, and analyze telemetry." />
    <meta name="author" content="AC License Center" />
    <meta name="theme-color" content="#141415" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://munoznicolas.github.io/ac-license-center/" />
    <meta property="og:site_name" content="AC License Center" />
    <meta property="og:title" content="AC License Center — Assetto Corsa License Test Designer" />
    <meta property="og:description" content="Assetto Corsa Driving School &amp; Telemetry Studio. Design license tests, inspect track gates, and analyze telemetry." />
    <meta property="og:image" content="https://munoznicolas.github.io/ac-license-center/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AC License Center — Assetto Corsa License Test Designer" />
    <meta name="twitter:description" content="Assetto Corsa Driving School &amp; Telemetry Studio. Design license tests, inspect track gates, and analyze telemetry." />
    <meta name="twitter:image" content="https://munoznicolas.github.io/ac-license-center/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AC License Center",
        "alternateName": "Assetto Corsa License Test Designer",
        "url": "https://munoznicolas.github.io/ac-license-center/",
        "description": "Assetto Corsa Driving School & Telemetry Studio. Design license tests, inspect track gates, and analyze telemetry.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Windows, Web",
        "image": "https://munoznicolas.github.io/ac-license-center/og-image.png",
        "author": {
          "@type": "Organization",
          "name": "AC License Center"
        }
      }
    </script>

    <!-- Fonts: Inter, Roboto, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          const stored = localStorage.getItem("theme");
          const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          const theme = stored || (prefersLight ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
